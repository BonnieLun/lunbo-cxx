<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习路径 · 伦博教育C++编程</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>

<main class="section page-top">
  <h2 class="section-title">🗺️ 学习路径 <span class="title-en">LEARNING PATH</span></h2>
  <p class="section-sub">四级火箭式进阶，每一级都有明确的目标赛事与能力标准。点击任意阶段直达对应课程与题库。</p>
  <div class="timeline" id="timeline"></div>
  <div class="path-cta">
    <a class="btn btn-primary" href="courses.html">📚 进入课程中心</a>
    <a class="btn btn-ghost" href="gym.html">🎮 去题库闯关</a>
  </div>
</main>

<footer><div class="foot-inner">
  <div>⚡ <b>伦博教育C++编程</b> — 从零基础到 CSP-J / CSP-S 高分</div>
  <div class="foot-motto"><code>while (alive) { keepCoding(); }</code></div>
</div></footer>

<script src="assets/js/data-courses.js"></script>
<script src="assets/js/data-exercises.js"></script>
<script src="assets/js/data-gen.js"></script>
<script src="assets/js/data-kata.js"></script>
<script src="assets/js/data-kata-gen.js"></script>
<script src="assets/js/common.js"></script>
<script>
renderNav('path.html');
initRain();
const map = { s1:'🌱', s2:'🔧', s3:'⚔️', s4:'🏆' };
$('#timeline').innerHTML = STAGES.map((s, i) => {
  const cCount = COURSES.filter(c => c.stage === s.id).length;
  const eCount = EXERCISES.filter(e => e.stage === s.id).length;
  const kCount = KATAS.filter(k => k.stage === s.id).length;
  return `
  <div class="tl-item" style="transition-delay:${i * .08}s">
    <div class="tl-stage">STAGE 0${i + 1} · ${map[s.id]}</div>
    <div class="tl-title" style="color:${s.color}">${s.name}</div>
    <div class="tl-desc">${s.desc}</div>
    <div class="tl-tags">${s.tags.map(t => `<span class="tl-tag">${t}</span>`).join('')}</div>
    <div class="tl-actions">
      <a class="btn btn-small" href="courses.html?stage=${s.id}">📚 ${cCount} 章课程</a>
      <a class="btn btn-small" href="gym.html?stage=${s.id}">🎮 ${eCount} 道习题</a>
      ${kCount ? `<a class="btn btn-small" href="oj.html?stage=${s.id}">💻 ${kCount} 道实战</a>` : ''}
    </div>
  </div>`;
}).join('');
setTimeout(() => $$('.tl-item').forEach(el => el.classList.add('on')), 80);
</script>
</body>
</html>
